name: Render Profile Stats

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/stats.js

      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "actions@github.com"
          git add assets/stats.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "stats: refresh profile numbers"
          git pull --rebase origin main
          git push
