<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .px { animation: flick 6s ease-in-out infinite; }
      .d1 { animation-delay: -0.7s; } .d2 { animation-delay: -1.4s; }
      .d3 { animation-delay: -2.1s; } .d4 { animation-delay: -2.8s; }
      .d5 { animation-delay: -3.5s; } .d6 { animation-delay: -4.2s; }
      .d7 { animation-delay: -4.9s; } .d8 { animation-delay: -5.6s; }
      @keyframes flick {
        0%, 100% { opacity: 1; }
        12% { opacity: 0.15; }
        24% { opacity: 1; }
        61% { opacity: 0.45; }
        78% { opacity: 1; }
      }
      .runner {
        animation: journey 14s linear infinite;
      }
      @keyframes journey {
        0%   { transform: translate(0px, 0px); opacity: 1; }
        4%   { opacity: 1; }
        45%  { transform: translate(-420px, 26px); opacity: 1; }
        50%  { transform: translate(-430px, 26px); opacity: 0; }
        100% { transform: translate(-430px, 26px); opacity: 0; }
      }
      .runner2 {
        animation: journey2 14s linear infinite;
        animation-delay: -7s;
      }
      @keyframes journey2 {
        0%   { transform: translate(0px, 0px); opacity: 1; }
        4%   { opacity: 1; }
        45%  { transform: translate(-380px, -18px); opacity: 1; }
        50%  { transform: translate(-390px, -18px); opacity: 0; }
        100% { transform: translate(-390px, -18px); opacity: 0; }
      }
      /* drawn at rest; the dash sweep is enhancement only */
      .rule { stroke-dasharray: 860; stroke-dashoffset: 0; }
      .dot { animation: breathe 2.6s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .intro { animation: rise 1s ease-out both; }
      .intro2 { animation: rise 1s ease-out 0.25s both; }
      /* transform-only: text must never depend on animation to become visible,
         since GitHub renders README SVGs as a static frame */
      @keyframes rise { from { transform: translateY(10px); } to { transform: translateY(0); } }
      .cap { animation: rise 1s ease-out 0.9s both; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="#101012"/>

  <!-- name block -->
  <text class="intro" x="72" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#f4f4f2">Mustapha Lamhamdi</text>
  <text class="intro2" x="74" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="17" letter-spacing="5" fill="#6b6b70">SOFTWARE ENGINEER</text>

  <!-- the jewel: living pixel mosaic -->
  <g transform="translate(770,72)">
    <rect class="px"    x="0"  y="0"  width="11" height="11" fill="#f97316"/>
    <rect class="px d3" x="13" y="0"  width="11" height="11" fill="#27272a"/>
    <rect class="px d5" x="26" y="0"  width="11" height="11" fill="#eab308"/>
    <rect class="px d1" x="39" y="0"  width="11" height="11" fill="#27272a"/>
    <rect class="px d7" x="52" y="0"  width="11" height="11" fill="#f97316"/>
    <rect class="px d2" x="65" y="0"  width="11" height="11" fill="#3f3f46"/>
    <rect class="px d4" x="78" y="0"  width="11" height="11" fill="#22d3ee"/>
    <rect class="px d6" x="91" y="0"  width="11" height="11" fill="#27272a"/>
    <rect class="px d8" x="104" y="0" width="11" height="11" fill="#f43f5e"/>
    <rect class="px d2" x="117" y="0" width="11" height="11" fill="#3f3f46"/>

    <rect class="px d4" x="0"  y="13" width="11" height="11" fill="#3f3f46"/>
    <rect class="px d6" x="13" y="13" width="11" height="11" fill="#22d3ee"/>
    <rect class="px d8" x="26" y="13" width="11" height="11" fill="#27272a"/>
    <rect class="px d1" x="39" y="13" width="11" height="11" fill="#f43f5e"/>
    <rect class="px d3" x="52" y="13" width="11" height="11" fill="#27272a"/>
    <rect class="px d5" x="65" y="13" width="11" height="11" fill="#eab308"/>
    <rect class="px d7" x="78" y="13" width="11" height="11" fill="#27272a"/>
    <rect class="px d2" x="91" y="13" width="11" height="11" fill="#a3e635"/>
    <rect class="px d4" x="104" y="13" width="11" height="11" fill="#27272a"/>
    <rect class="px d6" x="117" y="13" width="11" height="11" fill="#f97316"/>

    <rect class="px d8" x="0"  y="26" width="11" height="11" fill="#eab308"/>
    <rect class="px d1" x="13" y="26" width="11" height="11" fill="#27272a"/>
    <rect class="px d3" x="26" y="26" width="11" height="11" fill="#a3e635"/>
    <rect class="px d5" x="39" y="26" width="11" height="11" fill="#3f3f46"/>
    <rect class="px d7" x="52" y="26" width="11" height="11" fill="#22d3ee"/>
    <rect class="px d2" x="65" y="26" width="11" height="11" fill="#27272a"/>
    <rect class="px d4" x="78" y="26" width="11" height="11" fill="#f43f5e"/>
    <rect class="px d6" x="91" y="26" width="11" height="11" fill="#27272a"/>
    <rect class="px d8" x="104" y="26" width="11" height="11" fill="#eab308"/>
    <rect class="px d1" x="117" y="26" width="11" height="11" fill="#27272a"/>

    <rect class="px d3" x="0"  y="39" width="11" height="11" fill="#27272a"/>
    <rect class="px d5" x="13" y="39" width="11" height="11" fill="#f43f5e"/>
    <rect class="px d7" x="26" y="39" width="11" height="11" fill="#27272a"/>
    <rect class="px d2" x="39" y="39" width="11" height="11" fill="#22d3ee"/>
    <rect class="px d4" x="52" y="39" width="11" height="11" fill="#27272a"/>
    <rect class="px d6" x="65" y="39" width="11" height="11" fill="#f97316"/>
    <rect class="px d8" x="78" y="39" width="11" height="11" fill="#3f3f46"/>
    <rect class="px d1" x="91" y="39" width="11" height="11" fill="#eab308"/>
    <rect class="px d3" x="104" y="39" width="11" height="11" fill="#27272a"/>
    <rect class="px d5" x="117" y="39" width="11" height="11" fill="#a3e635"/>

    <rect class="px d7" x="0"  y="52" width="11" height="11" fill="#22d3ee"/>
    <rect class="px d2" x="13" y="52" width="11" height="11" fill="#27272a"/>
    <rect class="px d4" x="26" y="52" width="11" height="11" fill="#f97316"/>
    <rect class="px d6" x="39" y="52" width="11" height="11" fill="#27272a"/>
    <rect class="px d8" x="52" y="52" width="11" height="11" fill="#a3e635"/>
    <rect class="px d1" x="65" y="52" width="11" height="11" fill="#27272a"/>
    <rect class="px d3" x="78" y="52" width="11" height="11" fill="#eab308"/>
    <rect class="px d5" x="91" y="52" width="11" height="11" fill="#27272a"/>
    <rect class="px d7" x="104" y="52" width="11" height="11" fill="#f43f5e"/>
    <rect class="px d2" x="117" y="52" width="11" height="11" fill="#3f3f46"/>
  </g>

  <!-- escaped pixels drifting toward the name -->
  <g transform="translate(770,72)">
    <rect class="runner" x="-6" y="30" width="8" height="8" fill="#f97316"/>
    <rect class="runner2" x="-6" y="52" width="8" height="8" fill="#22d3ee"/>
  </g>

  <text class="cap" x="770" y="160" font-family="'Courier New', monospace" font-size="12.5" fill="#52525b">every pixel placed on purpose</text>

  <!-- baseline -->
  <line class="rule" x1="72" y1="216" x2="930" y2="216" stroke="#26262a" stroke-width="1.2"/>

  <g class="cap">
    <circle class="dot" cx="78" cy="248" r="4" fill="#a3e635"/>
    <text x="94" y="253" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#6b6b70">available for opportunities &#183; Rabat, Morocco</text>
    <text x="930" y="253" text-anchor="end" font-family="'Courier New', monospace" font-size="13" fill="#3f3f46">v2026.1</text>
  </g>
</svg>
