<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1224"/>
      <stop offset="1" stop-color="#070a16"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="tGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c1"><rect class="t1" x="90" y="86" height="24" width="0"/></clipPath>
    <clipPath id="c2"><rect class="t2" x="90" y="146" height="24" width="0"/></clipPath>
    <clipPath id="c3"><rect class="t3" x="90" y="296" height="24" width="0"/></clipPath>
    <style>
      text { font-family: 'Courier New', Menlo, Consolas, monospace; font-size: 17px; }
      .cycle { animation: master 16s linear infinite; }
      @keyframes master { 0% {opacity:0} 1% {opacity:1} 97% {opacity:1} 100% {opacity:0} }

      .t1 { animation: type1 16s steps(8) infinite; }
      @keyframes type1 { 0%,2% {width:0} 8% {width:85px} 100% {width:85px} }
      .o1 { animation: show1 16s linear infinite; }
      @keyframes show1 { 0%,10% {opacity:0} 11%,100% {opacity:1} }

      .t2 { animation: type2 16s steps(14) infinite; }
      @keyframes type2 { 0%,16% {width:0} 24% {width:150px} 100% {width:150px} }
      .o2a { animation: show2a 16s linear infinite; }
      @keyframes show2a { 0%,26% {opacity:0} 27%,100% {opacity:1} }
      .o2b { animation: show2b 16s linear infinite; }
      @keyframes show2b { 0%,29% {opacity:0} 30%,100% {opacity:1} }
      .o2c { animation: show2c 16s linear infinite; }
      @keyframes show2c { 0%,32% {opacity:0} 33%,100% {opacity:1} }
      .o2d { animation: show2d 16s linear infinite; }
      @keyframes show2d { 0%,35% {opacity:0} 36%,100% {opacity:1} }

      .t3 { animation: type3 16s steps(17) infinite; }
      @keyframes type3 { 0%,44% {width:0} 52% {width:185px} 100% {width:185px} }
      .bar { animation: grow 16s linear infinite; }
      @keyframes grow { 0%,54% {width:0} 72% {width:420px} 100% {width:420px} }
      .o3 { animation: show3 16s linear infinite; }
      @keyframes show3 { 0%,74% {opacity:0} 76%,100% {opacity:1} }

      .cursor { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      .lastline { animation: showlast 16s linear infinite; }
      @keyframes showlast { 0%,78% {opacity:0} 80%,100% {opacity:1} }
    </style>
  </defs>

  <!-- Window frame -->
  <rect x="10" y="10" width="880" height="410" rx="14" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="10" y="10" width="880" height="42" rx="14" fill="#111827"/>
  <rect x="10" y="38" width="880" height="14" fill="#111827"/>
  <circle cx="38" cy="31" r="7" fill="#ff5f57"/>
  <circle cx="62" cy="31" r="7" fill="#febc2e"/>
  <circle cx="86" cy="31" r="7" fill="#28c840"/>
  <text x="450" y="36" text-anchor="middle" fill="#475569" font-size="14">mustapha@dev — zsh</text>

  <g class="cycle">
    <!-- Command 1 -->
    <text x="30" y="104" fill="#22d3ee" filter="url(#tGlow)">➜  ~</text>
    <g clip-path="url(#c1)"><text x="92" y="104" fill="#e2e8f0">whoami</text></g>
    <text class="o1" x="92" y="132" fill="#94a3b8">mustapha — software engineer · problem solver</text>

    <!-- Command 2 -->
    <g class="o1">
      <text x="30" y="164" fill="#22d3ee" filter="url(#tGlow)">➜  ~</text>
      <g clip-path="url(#c2)"><text x="92" y="164" fill="#e2e8f0">cat skills.txt</text></g>
    </g>
    <text class="o2a" x="92" y="192" fill="#facc15">◆ Java / JavaFX     ██████████░░  building desktop apps</text>
    <text class="o2b" x="92" y="218" fill="#4ade80">◆ JavaScript / TS   █████████░░░  full-stack web</text>
    <text class="o2c" x="92" y="244" fill="#c084fc">◆ PHP / MySQL       █████████░░░  backend + data</text>
    <text class="o2d" x="92" y="270" fill="#fb7185">◆ Git / Linux       ████████░░░░  dev workflow</text>

    <!-- Command 3 -->
    <g class="o2d">
      <text x="30" y="314" fill="#22d3ee" filter="url(#tGlow)">➜  ~</text>
      <g clip-path="url(#c3)"><text x="92" y="314" fill="#e2e8f0">./deploy --future</text></g>
    </g>
    <rect x="92" y="330" width="420" height="14" rx="7" fill="#1e293b"/>
    <rect class="bar" x="92" y="330" height="14" rx="7" width="0" fill="url(#barGrad)" filter="url(#tGlow)"/>
    <text class="o3" x="530" y="342" fill="#22c55e" filter="url(#tGlow)">✔ 100% — SHIPPED 🚀</text>

    <!-- Idle prompt -->
    <g class="lastline">
      <text x="30" y="388" fill="#22d3ee" filter="url(#tGlow)">➜  ~</text>
      <rect class="cursor" x="94" y="373" width="11" height="20" fill="#00f5ff" filter="url(#tGlow)"/>
    </g>
  </g>
</svg>
